services:
  postgres:
    image: postgres:17-alpine
    container_name: pylon-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pylon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pylon_dev}
      POSTGRES_DB: ${POSTGRES_DB:-pylon}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pylon-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pylon} -d ${POSTGRES_DB:-pylon}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pylon-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - pylon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: pylon-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    networks:
      - pylon-net
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost 2181 10"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: pylon-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_INTERNAL_PORT:-9093}:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - pylon-net
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pylon-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pylon
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - pylon-net

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: pylon-jaeger
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - pylon-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: pylon-otel-collector
    depends_on:
      - jaeger
    command:
      - "--config=/etc/otelcol/config.yaml"
    volumes:
      - ./deploy/jaeger/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
    networks:
      - pylon-net

  migrate:
    image: migrate/migrate:v4.18.3
    container_name: pylon-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-pylon}:${POSTGRES_PASSWORD:-pylon_dev}@postgres:5432/${POSTGRES_DB:-pylon}?sslmode=disable"
      - "up"
    networks:
      - pylon-net
    restart: "no"

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: chat
    image: pylon-chat-service:local
    container_name: pylon-chat-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    ports:
      - "${CHAT_SERVICE_PORT:-9001}:9001"
    environment:
      APP_ENV: development
      APP_PORT: "9001"
      GRPC_PORT: "9001"
      DATABASE_URL: postgres://${POSTGRES_USER:-pylon}:${POSTGRES_PASSWORD:-pylon_dev}@postgres:5432/${POSTGRES_DB:-pylon}?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: pylon
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_TRACING_ENABLED: "true"
    networks:
      - pylon-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9001/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  presence-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: presence
    image: pylon-presence-service:local
    container_name: pylon-presence-service
    depends_on:
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "${PRESENCE_SERVICE_PORT:-9002}:9002"
    environment:
      APP_ENV: development
      APP_PORT: "9002"
      PRESENCE_GRPC_PORT: "9002"
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_TRACING_ENABLED: "true"
    networks:
      - pylon-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9002/ready >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  room-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: room
    image: pylon-room-service:local
    container_name: pylon-room-service
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    ports:
      - "${ROOM_SERVICE_PORT:-9003}:9003"
    environment:
      APP_ENV: development
      APP_PORT: "9003"
      ROOM_GRPC_PORT: "9003"
      DATABASE_URL: postgres://${POSTGRES_USER:-pylon}:${POSTGRES_PASSWORD:-pylon_dev}@postgres:5432/${POSTGRES_DB:-pylon}?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_TRACING_ENABLED: "true"
    networks:
      - pylon-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9003/ready >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: notification
    image: pylon-notification-service:local
    container_name: pylon-notification-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      room-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-9004}:9004"
    environment:
      APP_ENV: development
      APP_PORT: "9004"
      NOTIFICATION_GRPC_PORT: "9004"
      DATABASE_URL: postgres://${POSTGRES_USER:-pylon}:${POSTGRES_PASSWORD:-pylon_dev}@postgres:5432/${POSTGRES_DB:-pylon}?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: pylon
      ROOM_SERVICE_URL: http://room-service:9003
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_TRACING_ENABLED: "true"
    networks:
      - pylon-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9004/ready >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    image: pylon-api-gateway:local
    container_name: pylon-api-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      chat-service:
        condition: service_healthy
      presence-service:
        condition: service_healthy
      room-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      APP_ENV: development
      APP_PORT: "8080"
      APP_LOG_LEVEL: debug
      CORS_ORIGINS: http://localhost:${PYLON_WEB_PORT:-3000},http://127.0.0.1:${PYLON_WEB_PORT:-3000},http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: postgres://${POSTGRES_USER:-pylon}:${POSTGRES_PASSWORD:-pylon_dev}@postgres:5432/${POSTGRES_DB:-pylon}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-pylon-dev-secret-change-me}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-168h}
      CHAT_SERVICE_URL: http://chat-service:9001
      PRESENCE_SERVICE_URL: http://presence-service:9002
      ROOM_SERVICE_URL: http://room-service:9003
      NOTIFICATION_SERVICE_URL: http://notification-service:9004
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_TRACING_ENABLED: "true"
    networks:
      - pylon-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  pylon-web:
    build:
      context: ./pylon-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PYLON_WEB_API_URL:-http://localhost:8080}
    image: pylon-web:local
    container_name: pylon-web
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "${PYLON_WEB_PORT:-3000}:80"
    networks:
      - pylon-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

networks:
  pylon-net:
    name: pylon-net
    driver: bridge

volumes:
  postgres_data:
  redis_data:

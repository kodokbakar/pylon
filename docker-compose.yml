services:
  # PostgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: pylon-postgres
    environment:
      POSTGRES_USER: pylon
      POSTGRES_PASSWORD: pylon_dev
      POSTGRES_DB: pylon
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pylon"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: pylon-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Zookeeper (required by Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: pylon-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost 2181"]
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - "2181:2181"

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: pylon-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  # Kafka UI (optional, for debugging)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pylon-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pylon
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: pylon-jaeger
    ports:
      - "16686:16686"
      - "4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: pylon-otel-collector
    depends_on:
      - jaeger
    command:
      - "--config=/etc/otelcol/config.yaml"
    volumes:
      - ./deploy/jaeger/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: chat
    image: pylon-chat-service:local
    container_name: pylon-chat-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "9001:9001"
    environment:
      APP_ENV: development
      APP_PORT: "9001"
      DATABASE_URL: postgres://pylon:pylon_dev@postgres:5432/pylon?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_TRACING_ENABLED: "true"

  presence-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: presence
    image: pylon-presence-service:local
    container_name: pylon-presence-service
    depends_on:
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "9002:9002"
    environment:
      APP_ENV: development
      APP_PORT: "9002"
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_TRACING_ENABLED: "true"

  room-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: room
    image: pylon-room-service:local
    container_name: pylon-room-service
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "9003:9003"
    environment:
      APP_ENV: development
      APP_PORT: "9003"
      DATABASE_URL: postgres://pylon:pylon_dev@postgres:5432/pylon?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_TRACING_ENABLED: "true"

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: notification
    image: pylon-notification-service:local
    container_name: pylon-notification-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "9004:9004"
    environment:
      APP_ENV: development
      APP_PORT: "9004"
      DATABASE_URL: postgres://pylon:pylon_dev@postgres:5432/pylon?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_TRACING_ENABLED: "true"

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    image: pylon-api-gateway:local
    container_name: pylon-api-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chat-service:
        condition: service_started
      presence-service:
        condition: service_started
      room-service:
        condition: service_started
      notification-service:
        condition: service_started
      otel-collector:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      APP_PORT: "8080"
      DATABASE_URL: postgres://pylon:pylon_dev@postgres:5432/pylon?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: pylon-dev-secret-change-me
      CHAT_SERVICE_URL: http://chat-service:9001
      PRESENCE_SERVICE_URL: http://presence-service:9002
      ROOM_SERVICE_URL: http://room-service:9003
      NOTIFICATION_SERVICE_URL: http://notification-service:9004
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_TRACING_ENABLED: "true"

volumes:
  postgres_data:
  redis_data:

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    paths:
      - ^pylon-web/node_modules/
      - ^pylon-web/dist/

formatters:
  exclusions:
    paths:
      - ^pylon-web/node_modules/
      - ^pylon-web/dist/

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
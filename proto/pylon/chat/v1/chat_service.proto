syntax = "proto3";

package pylon.chat.v1;

option go_package = "github.com/kodokbakar/pylon/gen/pylon/chat/v1;chatv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// ChatService handles real-time messaging
service ChatService {
  // SendMessage sends a message to a room
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);

  // StreamMessages streams real-time messages from a room
  rpc StreamMessages(StreamMessagesRequest) returns (stream Message);

  // GetMessages retrieves message history from a room
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);
}

// Message represents a chat message
message Message {
  string id = 1;
  string room_id = 2;
  string sender_id = 3;
  string content = 4;
  MessageType type = 5;
  google.protobuf.Timestamp created_at = 6;
}

// MessageType represents the type of message
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_TEXT = 1;
  MESSAGE_TYPE_IMAGE = 2;
  MESSAGE_TYPE_SYSTEM = 3;
}

message SendMessageRequest {
  string room_id = 1;
  string sender_id = 2;
  string content = 3;
  MessageType type = 4;
}

message SendMessageResponse {
  Message message = 1;
}

message StreamMessagesRequest {
  string room_id = 1;
  string user_id = 2;
}

message GetMessagesRequest {
  string room_id = 1;
  int32 limit = 2;
  string before_id = 3;
}

message GetMessagesResponse {
  repeated Message messages = 1;
  bool has_more = 2;
}

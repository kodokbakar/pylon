name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  GO_VERSION: "1.26.4"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify generated protobuf files
        run: |
          test -f gen/pylon/chat/v1/chat_service.pb.go
          test -f gen/pylon/chat/v1/chatv1connect/chat_service.connect.go
          test -f gen/pylon/gateway/v1/gateway_service.pb.go
          test -f gen/pylon/gateway/v1/gatewayv1connect/gateway_service.connect.go
          test -f gen/pylon/presence/v1/presence_service.pb.go
          test -f gen/pylon/presence/v1/presencev1connect/presence_service.connect.go
          test -f gen/pylon/room/v1/room_service.pb.go
          test -f gen/pylon/room/v1/roomv1connect/room_service.connect.go
          test -f gen/pylon/notification/v1/notification_service.pb.go
          test -f gen/pylon/notification/v1/notificationv1connect/notification_service.connect.go

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pylon
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pylon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pylon -d pylon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgres://pylon:test@localhost:5432/pylon_test?sslmode=disable
      REDIS_URL: redis://localhost:6379
      KAFKA_BROKERS: localhost:9092
      KAFKA_CLIENT_ID: pylon-ci
      JWT_SECRET: ci-secret
      CHAT_SERVICE_URL: http://localhost:9001
      PRESENCE_SERVICE_URL: http://localhost:9002
      ROOM_SERVICE_URL: http://localhost:9003
      NOTIFICATION_SERVICE_URL: http://localhost:9004

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify generated protobuf files
        run: |
          test -f gen/pylon/chat/v1/chat_service.pb.go
          test -f gen/pylon/chat/v1/chatv1connect/chat_service.connect.go
          test -f gen/pylon/gateway/v1/gateway_service.pb.go
          test -f gen/pylon/gateway/v1/gatewayv1connect/gateway_service.connect.go
          test -f gen/pylon/presence/v1/presence_service.pb.go
          test -f gen/pylon/presence/v1/presencev1connect/presence_service.connect.go
          test -f gen/pylon/room/v1/room_service.pb.go
          test -f gen/pylon/room/v1/roomv1connect/room_service.connect.go
          test -f gen/pylon/notification/v1/notification_service.pb.go
          test -f gen/pylon/notification/v1/notificationv1connect/notification_service.connect.go

      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify generated protobuf files
        run: |
          test -f gen/pylon/chat/v1/chat_service.pb.go
          test -f gen/pylon/chat/v1/chatv1connect/chat_service.connect.go
          test -f gen/pylon/gateway/v1/gateway_service.pb.go
          test -f gen/pylon/gateway/v1/gatewayv1connect/gateway_service.connect.go
          test -f gen/pylon/presence/v1/presence_service.pb.go
          test -f gen/pylon/presence/v1/presencev1connect/presence_service.connect.go
          test -f gen/pylon/room/v1/room_service.pb.go
          test -f gen/pylon/room/v1/roomv1connect/room_service.connect.go
          test -f gen/pylon/notification/v1/notification_service.pb.go
          test -f gen/pylon/notification/v1/notificationv1connect/notification_service.connect.go

      - name: Build all services
        run: make build
apiVersion: v1
kind: Secret
metadata:
  name: pylon-secrets
  namespace: pylon
  labels:
    app.kubernetes.io/name: pylon-secrets
    app.kubernetes.io/part-of: pylon
  annotations:
    pylon.io/security-warning: "Minikube-only development values. Do not use in production."
type: Opaque
stringData:
  DATABASE_URL: "postgres://pylon:pylon_dev@postgres-service:5432/pylon?sslmode=disable"
  REDIS_URL: "redis://redis-service:6379"
  REDIS_PASSWORD: ""
  JWT_SECRET: "minikube-dev-jwt-secret-change-me"
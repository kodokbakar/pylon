apiVersion: v1
kind: ConfigMap
metadata:
  name: pylon-config
  namespace: pylon
  labels:
    app.kubernetes.io/name: pylon-config
    app.kubernetes.io/part-of: pylon
data:
  APP_ENV: "production"
  APP_PORT: "8080"
  APP_LOG_LEVEL: "info"
  CORS_ORIGINS: "https://pylon.example.com"

  DATABASE_MAX_OPEN_CONNS: "25"
  DATABASE_MAX_IDLE_CONNS: "5"
  DATABASE_CONN_MAX_LIFETIME: "5m"

  KAFKA_BROKERS: "kafka-service:9092"
  KAFKA_CLIENT_ID: "pylon"

  CHAT_SERVICE_URL: "http://chat-service:9001"
  PRESENCE_SERVICE_URL: "http://presence-service:9002"
  ROOM_SERVICE_URL: "http://room-service:9003"
  NOTIFICATION_SERVICE_URL: "http://notification-service:9004"

  GRPC_PORT: "9001"
  PRESENCE_GRPC_PORT: "9002"
  ROOM_GRPC_PORT: "9003"
  NOTIFICATION_GRPC_PORT: "9004"

  WS_MAX_CONNECTIONS: "1000"
  WS_READ_BUFFER_SIZE: "4096"
  WS_WRITE_BUFFER_SIZE: "4096"
  WS_INSECURE_SKIP_VERIFY: "false"

  JWT_EXPIRY: "24h"
  JWT_REFRESH_EXPIRY: "168h"
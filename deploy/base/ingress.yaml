apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pylon-ingress
  namespace: pylon
  labels:
    app.kubernetes.io/name: pylon-ingress
    app.kubernetes.io/part-of: pylon
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/websocket-services: "api-gateway"
spec:
  rules:
    - host: pylon.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
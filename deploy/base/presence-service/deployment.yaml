apiVersion: apps/v1
kind: Deployment
metadata:
  name: presence-service
  namespace: pylon
  labels:
    app.kubernetes.io/name: presence-service
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: pylon
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: presence-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: presence-service
        app.kubernetes.io/component: service
        app.kubernetes.io/part-of: pylon
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9002"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: presence-service
          image: ghcr.io/kodokbakar/pylon/presence-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9002
              name: http
          envFrom:
            - configMapRef:
                name: pylon-config
            - secretRef:
                name: pylon-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
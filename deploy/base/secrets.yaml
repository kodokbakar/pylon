apiVersion: v1
kind: Secret
metadata:
  name: pylon-secrets
  namespace: pylon
  labels:
    app.kubernetes.io/name: pylon-secrets
    app.kubernetes.io/part-of: pylon
type: Opaque
stringData:
  DATABASE_URL: "postgres://pylon:change-me@postgres-service:5432/pylon?sslmode=disable"
  REDIS_URL: "redis://redis-service:6379"
  REDIS_PASSWORD: ""
  JWT_SECRET: "change-me-production-jwt-secret"
apiVersion: v1
kind: Secret
metadata:
  name: pylon-secrets
  namespace: pylon
  labels:
    app.kubernetes.io/name: pylon-secrets
    app.kubernetes.io/part-of: pylon
  annotations:
    pylon.io/security-warning: "Example values only. Replace with ExternalSecret, SealedSecret, or generated Kubernetes Secret before production."
type: Opaque
stringData:
  # SECURITY WARNING:
  # These values are placeholders for local/template rendering only.
  # Do not apply this Secret to production as-is.
  # Production should use External Secrets Operator, Sealed Secrets, or a generated random secret.
  DATABASE_URL: "postgres://pylon:REPLACE_WITH_POSTGRES_PASSWORD@postgres-service:5432/pylon?sslmode=disable"
  REDIS_URL: "redis://redis-service:6379"
  REDIS_PASSWORD: ""
  JWT_SECRET: "REPLACE_WITH_STRONG_RANDOM_JWT_SECRET_DO_NOT_USE_IN_PRODUCTION"